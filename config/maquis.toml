# Maquis の実行設定(Android端末 SHG11)。値の根拠は docs/02 の「既定値」と config/hive.toml。
game = "maquis"

[target]
kind = "android"
serial = "355092380222016"  # adb は必ずこのシリアルを付けて呼ぶ
input_space = "display"

[runner]
step_limit = 60             # 1ゲームは約5ターン × (配置3 + 終了 + 行動 + 終了) ≒ 40手
confidence_threshold = 0.5
think_budget_sec = 3.0
