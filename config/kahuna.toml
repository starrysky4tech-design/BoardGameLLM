# Kahuna の実行設定(Android端末 SHG11)。値の根拠は docs/02 の「既定値」。
game = "kahuna"

[target]
kind = "android"
serial = "355092380222016"  # adb は必ずこのシリアルを付けて呼ぶ
input_space = "display"

[runner]
step_limit = 1000
# 既定の0.8(仮)では、正しく読めた自分の手番の画面93枚のうち75枚が止まる。手札の端が隠れた
# 1枚の一致度が、正しくても0.77〜0.79に収まるため。93枚の最小(0.77)の下に置いた(2026-10-30)。
# 誤読の画面は、動いているカードで 0.0〜0.65。フェーズ7のログで評価セットを増やして見直す
confidence_threshold = 0.75
