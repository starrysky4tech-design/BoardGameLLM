# Wingspan の実行設定(Android 端末 SHG11。カスタムゲーム: 人間 1 + AI 1)。値の根拠は docs/02 の「既定値」。
# 再開のときは、環境変数 WINGSPAN_HAND_SIZE(手札の全部の枚数)、WINGSPAN_ROUND(ラウンド)を渡す。
game = "wingspan"

[target]
kind = "android"
serial = "355092380222016"  # adb は必ずこのシリアルを付けて呼ぶ
input_space = "display"

[runner]
step_limit = 300
confidence_threshold = 0.5
think_budget_sec = 10.0
wait_poll_sec = 2.0
wait_limit_sec = 60.0  # 相手の手番は約 2 秒。ダイアログまでの待ちの上限
unchanged_limit = 2
repeated_state_limit = 3
