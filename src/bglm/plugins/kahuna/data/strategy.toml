# Kahuna の評価関数の重み。初期値は docs/02 の「Kahunaの手の選択」。
# 自己対戦(tests/unit/plugins/kahuna/logic/test_simulation.py)で調整する。値の根拠は(仮)。

[evaluation]
# 自分と相手の支配している島の数の差の重み。決算の得点に直結する。
# 決算は1ラウンド目が1点、2ラウンド目が2点、3ラウンド目は島の数の差なので、後のラウンドほど重い
stone_by_round = [10.0, 14.0, 20.0]
# 決算が近い(山札と場札の残りが少ない)ときは、島の数の差をさらに重く見る
late_cards = 4
late_multiplier = 2.0
# あと1本で支配できる島の数の差
near_control = 3.0
# 盤上の杖コマの数の差
stick = 1.0

[cost]
# 手札は1手番に1枚しか増えないので、カードを使うこと自体に代価をつける。
# 杖コマの除去は2枚使うので、この2倍
card = 0.5
# 山札から引くカードの価値は、12島の札の平均的な有用さにこの割合を掛ける(中身が分からないため)
deck_card_fraction = 0.8
# 手を打つ価値の最低ライン(これ未満の手は打たない)
min_gain = 0.2
